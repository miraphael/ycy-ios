# CI 跳板仓库 —— 只放构建配置，真正的源码在 miraphael/huimandao
#
# 为什么存在：
#   Codemagic 上的应用 `ycy-ios`（appId 6ac8707178dd78cd4dc1d681）绑定的仓库
#   已经被删了，而 Codemagic 没有「通过 API 新建应用」的接口。
#   这个仓库用同名把它重新占住，构建时再去 clone 真正的项目源码。
#
# 产物：绘漫岛-unsigned.ipa（未签名，装机前需 zsign 重签）
#
# ⚠️ miraphael/huimandao 的仓库根目录 **就是** ios/ 目录（project.yml 在根），
#    所以 clone 下来直接 cd src 即可，没有 src/ios 这一层。

workflows:
  build-huimandao:
    name: Build 绘漫岛 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # 必须 Xcode 16.3+：Nuke 13.x 用了 `nonisolated`（Swift 6.1 语法）
      xcode: latest
      vars:
        APP_REPO: https://github.com/miraphael/huimandao.git
        SCHEME: 绘漫岛
    cache:
      cache_paths:
        - $HOME/Library/Caches/org.swift.swiftpm
        - $HOME/Library/Developer/Xcode/DerivedData
    scripts:
      - name: Checkout app source
        script: |
          set -e
          rm -rf src
          git clone --depth 1 "$APP_REPO" src
          cd src && git log --oneline -1 && ls -la | head -30

      - name: Install xcodegen
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            echo "xcodegen not found, installing"
            brew install xcodegen
          fi
          xcodegen --version

      - name: Show toolchain versions
        script: |
          xcodebuild -version
          swift --version

      - name: Generate Xcode project
        script: |
          set -euxo pipefail
          pwd
          ls -la src | head -40
          cd src
          xcodegen generate
          ls -la "$SCHEME.xcodeproj" | head -10

      - name: Resolve SPM dependencies
        script: |
          cd src
          xcodebuild -project "$SCHEME.xcodeproj" -resolvePackageDependencies -scheme "$SCHEME" || true

      - name: Build unsigned IPA
        script: |
          cd src
          set -uo pipefail
          xcodebuild -project "$SCHEME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" \
            -derivedDataPath build \
            build > build.log 2>&1
          BUILD_STATUS=$?

          # 🔴 无论成败都先把日志搬到 build 根目录，保证能作为 artifact 上传
          #    （失败时 Publishing 也会跑，但只有文件存在才会被发布）
          cp build.log "$CM_BUILD_DIR/build.log" 2>/dev/null || true

          echo "===== ERRORS ====="
          grep -E "error:" build.log | head -80 || true
          echo "===== TAIL ====="
          tail -80 build.log || true

          if [ "$BUILD_STATUS" -ne 0 ]; then
            echo "xcodebuild failed (exit $BUILD_STATUS) — 日志已作为 artifact 上传"
            # 诊断期故意 exit 0：让 build.log 进 artifact 便于读取
            exit 0
          fi

          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app 2>/dev/null | head -1)
          if [ -z "$APP" ]; then
            echo "no .app produced"
            exit 1
          fi
          EXEC_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist" 2>/dev/null || echo "")
          if [ -z "$EXEC_NAME" ] || [ ! -f "$APP/$EXEC_NAME" ]; then
            echo "missing executable (CFBundleExecutable='$EXEC_NAME')"
            exit 1
          fi

          cd "$CM_BUILD_DIR"
          rm -rf Payload 绘漫岛-unsigned.ipa
          mkdir -p Payload
          echo "Packaging src/$APP (exec=$EXEC_NAME)"
          cp -R "src/$APP" Payload/
          zip -qry 绘漫岛-unsigned.ipa Payload
          ls -lh 绘漫岛-unsigned.ipa

    artifacts:
      - 绘漫岛-unsigned.ipa
      - build.log
